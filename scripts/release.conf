# PhonixOS — configuração canônica de release (docs/release.md).
# Arquivo apenas com atribuições de variáveis, carregado com `. scripts/release.conf` por
# sh/bash (scripts/install.sh, deploy/quickstart.sh). Sem comandos, exports ou efeitos
# colaterais; nunca inclua credenciais ou tokens aqui.
# shellcheck disable=SC2034 # variáveis consumidas por quem carrega o arquivo

# Repositório GitHub (módulo Go github.com/gustavo-lopes-dev/PhonixOS).
PHONIX_REPO="gustavo-lopes-dev/PhonixOS"

# Versão SemVer sem o prefixo "v"; o tag imutável do release é "v${PHONIX_VERSION}".
# Deve coincidir com a versão exposta em /api/v1/health.
PHONIX_VERSION="1.0.0"

# Base de download dos assets do release desta versão.
PHONIX_RELEASE_BASE_URL="https://github.com/${PHONIX_REPO}/releases/download/v${PHONIX_VERSION}"

# Binários estáticos (CGO_ENABLED=0, frontend incorporado) por arquitetura.
PHONIX_BIN_ARM64="phonixos-linux-arm64" # uname -m: aarch64
PHONIX_BIN_ARM32="phonixos-linux-armv7" # uname -m: armv7l / armv8l (userland 32 bits)
